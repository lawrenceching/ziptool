<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Zip Tool</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="h-screen flex flex-col bg-white text-slate-800 text-sm">
    <!-- 顶栏: 压缩/解压模式切换 + 确认(运行中变取消) -->
    <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200">
      <div class="flex rounded-lg border border-slate-300 overflow-hidden">
        <button
          id="mode-compress"
          class="px-5 py-1.5 font-medium bg-blue-600 text-white transition-colors"
        >
          压缩
        </button>
        <button
          id="mode-extract"
          class="px-5 py-1.5 font-medium bg-white text-slate-600 hover:bg-slate-50 transition-colors border-l border-slate-300"
        >
          解压
        </button>
      </div>
      <button
        id="confirm"
        disabled
        class="px-6 py-1.5 rounded-lg bg-blue-600 text-white font-medium enabled:hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
      >
        确认
      </button>
    </header>

    <!-- 路径区: 点击输入框弹出系统文件夹选择 -->
    <div class="px-4 py-3 bg-white space-y-2.5">
      <div class="flex items-center gap-3">
        <label for="src" class="w-20 shrink-0 text-slate-500">源文件夹</label>
        <input
          id="src"
          readonly
          class="flex-1 px-2.5 py-1.5 rounded-md border border-slate-300 bg-slate-50 text-slate-600 cursor-pointer hover:border-blue-400 focus:outline-none"
          placeholder="点击选择要压缩 / 解压的文件夹"
        />
      </div>
      <div class="flex items-center gap-3">
        <label for="dst" class="w-20 shrink-0 text-slate-500">目标文件夹</label>
        <input
          id="dst"
          readonly
          class="flex-1 px-2.5 py-1.5 rounded-md border border-slate-300 bg-slate-50 text-slate-600 cursor-pointer hover:border-blue-400 focus:outline-none"
          placeholder="点击选择目标文件夹"
        />
      </div>
    </div>

    <!-- 选项行: 按模式显隐(压缩=分包/密码/随机名; 解压=密码/覆盖) -->
    <div
      id="options"
      class="px-4 py-2 bg-white border-b border-slate-200 flex items-center gap-x-5 gap-y-1.5 flex-wrap text-xs text-slate-500"
    >
      <span id="opt-split-wrap" class="flex items-center gap-1.5">
        <label for="opt-split" class="shrink-0">分包</label>
        <input
          id="opt-split"
          class="w-40 px-2 py-1 rounded-md border border-slate-300 text-slate-700 focus:outline-none focus:border-blue-400"
          placeholder="如 2g / 500m,留空不分包"
        />
      </span>
      <span id="opt-password-wrap" class="flex items-center gap-1.5">
        <label for="opt-password" class="shrink-0">密码</label>
        <input
          id="opt-password"
          type="password"
          autocomplete="off"
          class="w-36 px-2 py-1 rounded-md border border-slate-300 text-slate-700 focus:outline-none focus:border-blue-400"
          placeholder="留空不加密"
        />
      </span>
      <label id="opt-random-wrap" class="flex items-center gap-1.5 cursor-pointer">
        <input id="opt-random" type="checkbox" class="accent-blue-600 align-middle" />
        随机包名
      </label>
      <label id="opt-force-wrap" class="hidden items-center gap-1.5 cursor-pointer">
        <input id="opt-force" type="checkbox" class="accent-blue-600 align-middle" />
        覆盖已有文件
      </label>
    </div>

    <!-- 条目表格: 通栏铺满剩余空间 -->
    <main class="flex-1 min-h-0 overflow-auto">
      <table class="w-full">
        <caption class="sr-only">条目列表</caption>
        <thead class="sticky top-0 bg-slate-50 text-slate-500 text-xs">
          <tr class="border-b border-slate-200">
            <th class="w-10 py-2">
              <input
                id="check-all"
                type="checkbox"
                disabled
                aria-label="全选"
                class="accent-blue-600 align-middle"
              />
            </th>
            <th class="py-2 pr-2 text-left font-medium">文件名</th>
            <th class="py-2 pr-4 text-right font-medium">大小</th>
            <th class="w-24 py-2 pr-4 text-left font-medium">状态</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="py-16 text-center text-slate-400">
        点击「源文件夹」选择目录
      </div>
    </main>

    <!-- 状态栏 -->
    <footer class="flex items-center justify-between px-4 py-1.5 bg-white border-t border-slate-200 text-xs text-slate-500">
      <span id="msg" class="truncate min-w-0" title="">就绪</span>
      <span id="ver" class="shrink-0 pl-4"></span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
