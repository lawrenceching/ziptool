[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/tauri-app", "test", "xtask"]

[workspace.package]
version = "0.1.5"
edition = "2024"

[workspace.dependencies]
zip-tool-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
