name: Release

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (版本/tag 一致性 + CI 门禁)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 115
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 读取 Cargo.toml 版本并校验 tag
        id: version
        run: |
          CARGO_VER="$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)"
          TAURI_VER="$(jq -r .version crates/tauri-app/tauri.conf.json)"
          TAG="v$CARGO_VER"
          SHA="$(git rev-parse HEAD)"
          echo "cargo=$CARGO_VER tauri=$TAURI_VER tag=$TAG sha=$SHA"
          if [ "$CARGO_VER" != "$TAURI_VER" ]; then
            echo "::error::版本不一致: Cargo.toml=$CARGO_VER tauri.conf=$TAURI_VER"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 不存在; 请先运行 cargo bump-version $CARGO_VER 并推送 tag"
            exit 1
          fi
          TAG_SHA="$(git rev-parse "$TAG^{commit}")"
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::tag $TAG 指向 $TAG_SHA, 但当前 HEAD 是 $SHA; 请重新打 tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: 等待该 commit 的 CI 全绿
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "等待 CI: commit $SHA"
          deadline_wait=$(( $(date +%s) + 600 ))    # run 出现上限 10 分钟
          deadline_done=$(( $(date +%s) + 6000 ))   # 完成上限 100 分钟
          appeared=0
          while :; do
            now=$(date +%s)
            runs="$(gh run list --workflow=CI --commit="$SHA" --json status,conclusion --limit 20 2>/dev/null)" || runs="[]"
            status="$(jq -r '.[0].status // "none"' <<<"$runs")"
            conclusion="$(jq -r '.[0].conclusion // "none"' <<<"$runs")"
            [ "$status" != "none" ] && appeared=1
            if [ "$appeared" = 1 ]; then
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI 全绿: $SHA"
                  exit 0
                fi
                echo "::error::CI 结论为 $conclusion: $SHA"
                exit 1
              fi
              if [ "$now" -ge "$deadline_done" ]; then
                echo "::error::等待 CI 完成超时 (100 分钟)"
                exit 1
              fi
            elif [ "$now" -ge "$deadline_wait" ]; then
              echo "::error::10 分钟内未发现该 commit 的 CI run (该 commit 是否已推送?)"
              exit 1
            fi
            echo "CI 状态: status=$status conclusion=$conclusion, 30s 后重查"
            sleep 30
          done

  build:
    name: build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # 顺序约束: CLI 构建与归档必须先于 Tauri build —— tauri build 会把 crate bin
      # 改名为 target/release/ziptool.exe, 覆盖 CLI 的同名产物 (见 _docs/release.md §8 风险表)
      - name: Build CLI
        run: cargo build --release -p zip-tool-cli
      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          VER="${TAG#v}"
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p dist
          tar czf "dist/ziptool-cli-${VER}-${TRIPLE}.tar.gz" -C target/release ziptool
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          $triple = (rustc -vV | Select-String '^host: ').Line -replace '^host: ', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/ziptool.exe -DestinationPath "dist/ziptool-cli-$ver-$triple.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tauri-app/package-lock.json
      - name: Tauri build
        working-directory: crates/tauri-app
        run: npm ci && npx tauri build
      - name: Collect bundles (unix)
        if: runner.os != 'Windows'
        run: |
          b=target/release/bundle
          cp "$b"/deb/*.deb dist/ 2>/dev/null || true
          cp "$b"/rpm/*.rpm dist/ 2>/dev/null || true
          cp "$b"/appimage/*.AppImage dist/ 2>/dev/null || true
          cp "$b"/dmg/*.dmg dist/ 2>/dev/null || true
          ls -l dist
          case "$RUNNER_OS" in
            Linux) ls dist/*.deb dist/*.rpm dist/*.AppImage >/dev/null ;;
            macOS) ls dist/*.dmg >/dev/null ;;
          esac
      - name: Collect bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/
          Copy-Item target/release/bundle/msi/*.msi dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  release:
    name: release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: Create release
        run: |
          ls -l dist
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "ziptool $TAG" --generate-notes --verify-tag
          fi
